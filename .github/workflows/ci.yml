name: CI

on:
  push:
    branches: ["main", "rebuild/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check public/app.js
      - run: node --check server.js
      - run: node --input-type=module --check < public/immersive-table.js
      - run: npm test
