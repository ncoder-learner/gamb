name: Apply Game Hunk server patch
on:
  push:
    paths:
      - '.github/workflows/patch-server.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old="function ensureAccount(a){if(!a)return a;a.tokens=Number.isFinite(a.tokens)?Math.max(0,Math.floor(a.tokens)):1000;a.inventory=Array.isArray(a.inventory)?a.inventory:[];a.equipped=a.equipped&&typeof a.equipped==='object'?a.equipped:{};a.sessions=Array.isArray(a.sessions)?a.sessions:[];a.history=Array.isArray(a.history)?a.history:[];a.stats=a.stats&&typeof a.stats==='object'?a.stats:{gamesPlayed:0,wins:0,losses:0,largestWin:0,byGame:{}};a.daily=a.daily&&typeof a.daily==='object'?a.daily:{lastClaim:null,streak:0};return a}"
          new="function ensureAccount(a){if(!a)return a;a.tokens=Number.isFinite(a.tokens)?Math.max(0,Math.floor(a.tokens)):1000;a.inventory=Array.isArray(a.inventory)?a.inventory:[];a.equipped=a.equipped&&typeof a.equipped==='object'?a.equipped:{};a.sessions=Array.isArray(a.sessions)?a.sessions:[];a.history=Array.isArray(a.history)?a.history:[];a.stats=a.stats&&typeof a.stats==='object'?a.stats:{gamesPlayed:0,wins:0,losses:0,largestWin:0,byGame:{}};a.daily=a.daily&&typeof a.daily==='object'?a.daily:{lastClaim:null,streak:0};a.refill=a.refill&&typeof a.refill==='object'?a.refill:{lastClaim:0};return a}"
          assert old in s
          s=s.replace(old,new)
          marker="app.post('/api/reward-ad',(req,res)=>{"
          route="app.post('/api/refill',(req,res)=>{const a=accountFromToken(String(req.headers.authorization||'').replace(/^Bearer\\s+/i,''));if(!a)return res.status(401).json({error:'Not signed in.'});ensureAccount(a);const now=Date.now();const cooldown=24*60*60*1000;if(a.tokens>50)return res.status(400).json({error:'Refill is available when your vault is nearly empty.'});if(now-(a.refill.lastClaim||0)<cooldown){const left=cooldown-(now-(a.refill.lastClaim||0));return res.status(429).json({error:`Refill available in ${Math.ceil(left/3600000)} hours.`})}const amount=1000;a.tokens+=amount;a.refill.lastClaim=now;recordTransaction(a,amount,'token_refill',null,{reason:'empty_vault'});saveAccounts();res.json({ok:true,amount,account:accountResponse(a)});});\n"
          assert marker in s
          s=s.replace(marker,route+marker)
          marker2="  socket.on('playAgain',(_,ack)=>"
          event="  socket.on('returnToLobby',(_,ack)=>{const room=rooms.get(socket.data.room),p=room?.players.find(x=>x.id===socket.data.player);if(!room||!p)return ack?.({ok:false,error:'You are not in a room.'});if(room.hostId!==p.id)return ack?.({ok:false,error:'Only the host can return the table to the lobby.'});clearTimer(room);room.status='LOBBY';room.poker.phase='LOBBY';room.poker.community=[];room.poker.pot=0;room.poker.showdown=[];room.roulette={phase:'BETTING',bets:[],result:null};room.joinRequests=[];say(room,'The table returned to the lobby. Choose another game or start a new hand.');broadcast(room);ack?.({ok:true});});\n"
          assert marker2 in s
          s=s.replace(marker2,event+marker2)
          p.write_text(s)
      - run: node --check server.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git rm .github/workflows/patch-server.yml
          git commit -m 'Add vault refill and return-to-lobby flow'
          git push